name: cmake-build

on:
  push:
    branches:
      - main
    tags:
      - 'release-*'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # Pinning to specific commits to ensure patches apply. Generally they are set to the latest commits.
  REF_BINDIFF: 365c0f900d7805da94ed6e3bf193f56b122daa92
  REF_BINEXPORT: 64d3c59096601e18bf184523a6730bf3c46d6f82

permissions: {}

jobs:
  build:
    name: IDA ${{ matrix.idasdk.version }} on ${{ matrix.os.label }}
    runs-on: ${{ matrix.os.label }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - label: ubuntu-22.04
            artifacts_suffix: "x86_64-Linux-built_on_Ubuntu_22.04"
          - label: ubuntu-22.04-arm
            artifacts_suffix: "arm64-Linux-built_on_Ubuntu_22.04"
          - label: ubuntu-26.04
            artifacts_suffix: "x86_64-Linux-built_on_Ubuntu_26.04"
          - label: ubuntu-26.04-arm
            artifacts_suffix: "arm64-Linux-built_on_Ubuntu_26.04"
          - label: macos-26
            artifacts_suffix: "universal-macOS"
          - label: windows-2025
            artifacts_suffix: "x86_64-Windows"
          - label: windows-11-arm
            artifacts_suffix: "arm64-Windows"

        idasdk:
          - version: "9.4"
            repo_tag: "v9.4.0-release"

    steps:
    - name: Checkout current repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Checkout bindiff repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: google/bindiff
        ref: ${{ env.REF_BINDIFF }}
        path: bindiff
        submodules: recursive
        persist-credentials: false

    - name: Checkout binexport repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: google/binexport
        ref: ${{ env.REF_BINEXPORT }}
        path: binexport
        submodules: recursive
        persist-credentials: false

    - name: Apply patch (binexport)
      shell: bash
      working-directory: binexport
      run: |
        git apply ../patches/binexport-macro_IDA_SDK_VERSION.patch

    - name: Get idasdk
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: HexRaysSA/ida-sdk
        ref: ${{ matrix.idasdk.repo_tag }}
        path: idasdk
        submodules: recursive
        persist-credentials: false

    - name: Enable Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

    - name: Enable mold linker (Linux)
      if: runner.os == 'Linux'
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0
      with:
        cmakeVersion: 4.4.0
        ninjaVersion: 1.13.2

    - name: Configure CMake
      shell: bash
      run: |
        mkdir build
        cmake -S bindiff -B build -G Ninja \
          "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" \
          -DCMAKE_INSTALL_PREFIX=build \
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
          -DBINDIFF_BINEXPORT_DIR=binexport \
          "-DFETCHCONTENT_SOURCE_DIR_IDASDK=${PWD}/idasdk"

    - name: Build
      working-directory: build
      shell: bash
      run: cmake --build . --config "${BUILD_TYPE}"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: IDA_${{ matrix.idasdk.version }}-BinDiff-${{ matrix.os.artifacts_suffix }}
        path: |
          build/bindiff
          build/bindiff.exe
          build/ida/bindiff*
          build/tools/bindiff*

    - name: Configure CMake (binexport)
      shell: bash
      run: |
        mkdir build-binexport
        cmake -S binexport -B build-binexport -G Ninja \
          "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" \
          -DCMAKE_INSTALL_PREFIX=build-binexport \
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
          -DBINEXPORT_ENABLE_IDAPRO=ON \
          -DBINEXPORT_ENABLE_BINARYNINJA=OFF \
          "-DFETCHCONTENT_SOURCE_DIR_IDASDK=${PWD}/idasdk"

    - name: Build (binexport)
      working-directory: build-binexport
      shell: bash
      run: cmake --build . --config "${BUILD_TYPE}"

    - name: Upload Build Artifacts (binexport)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: IDA_${{ matrix.idasdk.version }}-BinExport-${{ matrix.os.artifacts_suffix }}
        path: |
          build-binexport/ida/binexport*
          build-binexport/tools/binexport2dump*

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating releases and uploading assets
      id-token: write # attest
      attestations: write # attest
      artifact-metadata: write # attest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          skip-decompress: true
          merge-multiple: true

      - name: Attest Build Artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/*

      - name: Create Release and Upload Assets
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: "${{ github.run_id }}"
          ANNOUNCEMENT_TITLE: "${{ github.ref_name }}"
          TAG_NAME: "${{ github.ref_name }}"
        run: |
          chmod +x ../.github/scripts/release.sh
          ../.github/scripts/release.sh
