name: cmake-build

on:
  push:
    branches:
      - main
    tags:
      - 'release-*'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # Pinning to specific commits to ensure patches apply. Generally they are set to the latest commits.
  REF_BINDIFF: 1713700a227607b0d6b46628e00de85cfa4c049b
  REF_BINEXPORT: c2dc05eed2fa85f8abd0c6e5a4c71478fe748c3b

permissions: {}

jobs:
  build:
    name: IDA ${{ matrix.idasdk.version }} on ${{ matrix.os.label }}
    runs-on: ${{ matrix.os.label }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - label: ubuntu-24.04
            type: linux
            artifacts_suffix: "x86_64-Linux-built_on_Ubuntu_24.04"
          - label: ubuntu-22.04
            type: linux
            artifacts_suffix: "x86_64-Linux-built_on_Ubuntu_22.04"
          - label: macos-26
            type: macos
            artifacts_suffix: "universal-macOS"
          - label: windows-2025
            type: windows
            artifacts_suffix: "x86_64-Windows"

        idasdk:
          - version: "9.0"
            type: hcli
            hcli_tag: "release/9.0/sdk-and-utilities/idasdk90.zip"
            zip_filename: "idasdk90.zip"
            subdir: "idasdk90"
          - version: "9.1"
            type: hcli
            hcli_tag: "release/9.1/sdk-and-utilities/idasdk91.zip"
            zip_filename: "idasdk91.zip"
            subdir: "idasdk91"
          - version: "9.2"
            type: oss
            repo_tag: "v9.2.0-sdk.1"
            subdir: "src"
          - version: "9.3"
            type: oss
            repo_tag: "v9.3.0-sdk.3"
            subdir: "src"
          - version: "9.3sp1"
            type: oss
            repo_tag: "v9.3.1-sdk.1"
            subdir: "src"
          - version: "9.4"
            type: oss
            repo_tag: "v9.4.0-release"
            subdir: "src"

    steps:
    - name: Checkout current repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Checkout bindiff repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: google/bindiff
        ref: ${{ env.REF_BINDIFF }}
        path: bindiff
        submodules: recursive
        persist-credentials: false

    - name: Checkout binexport repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: google/binexport
        ref: ${{ env.REF_BINEXPORT }}
        path: binexport
        submodules: recursive
        persist-credentials: false

    - name: Apply patch (bindiff)
      shell: bash
      working-directory: bindiff
      run: |
        git apply ../patches/bindiff-compile_abseil_mutexlock.patch
        git apply ../patches/bindiff-i64_matches_ida_exe.patch

    - name: Apply patch (binexport)
      shell: bash
      working-directory: binexport
      run: |
        git apply ../patches/binexport-cmake.patch
        git apply ../patches/binexport-FindIdaSdk_IDA930_rename_5da373a9c296da3fd3bf39efa5e1113eb6423df2.patch

    - name: Setup uv (hcli)
      if: matrix.idasdk.type == 'hcli'
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: false

    - name: Get idasdk (hcli)
      if: matrix.idasdk.type == 'hcli'
      shell: bash
      run: |
        mkdir idasdk
        uvx --from ida-hcli hcli --disable-updates download "${{ matrix.idasdk.hcli_tag }}"
        unzip -q "${{ matrix.idasdk.zip_filename }}" -d idasdk/
      env:
        HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}

    - name: Get idasdk (oss)
      if: matrix.idasdk.type == 'oss'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: HexRaysSA/ida-sdk
        ref: ${{ matrix.idasdk.repo_tag }}
        path: idasdk
        submodules: recursive
        persist-credentials: false

    - name: Enable Developer Command Prompt (Windows)
      if: matrix.os.type == 'windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Enable mold linker (Linux)
      if: matrix.os.type == 'linux'
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      with:
        cmakeVersion: 4.3.4
        ninjaVersion: 1.13.2

    - name: Configure CMake
      shell: bash
      env:
        OS_TYPE: ${{ matrix.os.type }}
        IDASDK_SUBDIR: ${{ matrix.idasdk.subdir }}
      run: |
        mkdir -p build/out

        # Build universal binaries on macOS (both arm64 and x86_64)
        if [ "${OS_TYPE}" = "macos" ]; then
          CMAKE_EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
        else
          CMAKE_EXTRA_FLAGS=""
        fi

        cmake -S bindiff -B build/out -G Ninja \
          "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" \
          -DCMAKE_INSTALL_PREFIX=build/out \
          -DBINDIFF_BINEXPORT_DIR=binexport \
          "-DIdaSdk_ROOT_DIR=${PWD}/idasdk/${IDASDK_SUBDIR}" \
          ${CMAKE_EXTRA_FLAGS}

    - name: Build
      working-directory: build/out
      shell: bash
      run: cmake --build . --config "${BUILD_TYPE}" --parallel 4

    - name: Test
      working-directory: build/out
      shell: bash
      run: ctest --build-config "${BUILD_TYPE}" --output-on-failure -R '^[A-Z]'

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: IDA_${{ matrix.idasdk.version }}-BinDiff-${{ matrix.os.artifacts_suffix }}
        path: |
          build/out/bindiff
          build/out/bindiff.exe
          build/out/ida/bindiff*
          build/out/tools/bindiff*

    - name: Configure CMake (binexport)
      shell: bash
      env:
        OS_TYPE: ${{ matrix.os.type }}
        IDASDK_SUBDIR: ${{ matrix.idasdk.subdir }}
      run: |
        # Build universal binaries on macOS (both arm64 and x86_64)
        if [ "${OS_TYPE}" = "macos" ]; then
          CMAKE_EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
        else
          CMAKE_EXTRA_FLAGS=""
        fi

        cmake -S binexport -B build/out/_deps/binexport-build -G Ninja \
          "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" \
          -DCMAKE_INSTALL_PREFIX=build/out/_deps/binexport-build \
          -DBINEXPORT_ENABLE_IDAPRO=ON \
          -DBINEXPORT_ENABLE_BINARYNINJA=ON \
          "-DIdaSdk_ROOT_DIR=${PWD}/idasdk/${IDASDK_SUBDIR}" \
          ${CMAKE_EXTRA_FLAGS}

    - name: Build (binexport)
      working-directory: build/out/_deps/binexport-build
      shell: bash
      run: cmake --build . --config "${BUILD_TYPE}" --parallel 4

    - name: Test (binexport)
      working-directory: build/out/_deps/binexport-build
      shell: bash
      run: ctest --build-config "${BUILD_TYPE}" --output-on-failure -R '^[A-Z]'

    - name: Upload Build Artifacts (binexport)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: IDA_${{ matrix.idasdk.version }}-BinExport-${{ matrix.os.artifacts_suffix }}
        path: |
          build/out/_deps/binexport-build/binaryninja/binexport*
          build/out/_deps/binexport-build/ida/binexport*
          build/out/_deps/binexport-build/tools/binexport2dump*

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating releases and uploading assets
      id-token: write # attest
      attestations: write # attest
      artifact-metadata: write # attest
    steps:
      - name: Checkout current repository to get commit message
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          skip-decompress: true
          merge-multiple: true

      - name: Attest Build Artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/*

      - name: Create Release and Upload Assets
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: "${{ github.run_id }}"
          ANNOUNCEMENT_TITLE: "${{ github.ref_name }}"
          TAG_NAME: "${{ github.ref_name }}"
        run: |
          set -euo pipefail

          FILES=(*)
          if [[ ${#FILES[@]} -eq 0 || ${FILES[0]} == '*' ]]; then
            echo "No release assets found in artifacts/" >&2
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_MSG_ONELINE=$(printf '%s' "$COMMIT_MSG" | tr '\n' ' ')

          NOTES=$(cat <<EOF
          From GitHub Actions run: [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})

          BinDiff: [`${REF_BINDIFF}`](https://github.com/google/bindiff/commit/${REF_BINDIFF})

          BinExport: [`${REF_BINEXPORT}`](https://github.com/google/binexport/commit/${REF_BINEXPORT})

          Refer to README.md for guidance on selecting and installing the version.
          EOF
          )

          # If COMMIT_MSG contains an HTML details block, extract summary as title and the rest as extra notes
          if printf '%s' "$COMMIT_MSG" | grep -q '<details>'; then
            TITLE=$(printf '%s' "$COMMIT_MSG" | perl -0777 -ne 'print $1 if /<summary>(.*?)<\/summary>/s')
            BODY=$(printf '%s' "$COMMIT_MSG" | perl -0777 -ne 'print $1 if /<summary>.*?<\/summary>\s*(.*?)<\/details>/s')
            TITLE=$(printf '%s' "$TITLE" | tr '\n' ' ' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            BODY=$(printf '%s' "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [[ -n "$TITLE" ]]; then
              ANNOUNCEMENT_TITLE="$TITLE"
            fi
            if [[ -n "$BODY" ]]; then
              NOTES=$(printf '%s\n\n---\n\n%s' "$BODY" "$NOTES")
            fi
          fi

          # Parse commit-message flags like prerelease=0 latest=1 draft=0 and map to release flags
          parse_flag() {
            key=$1
            printf '%s' "$COMMIT_MSG_ONELINE" | grep -oP "${key}=\K[01]" | head -n1 || true
          }

          PRERELEASE_VAL=$(parse_flag prerelease)
          LATEST_VAL=$(parse_flag latest)
          DRAFT_VAL=$(parse_flag draft)

          if [[ "$PRERELEASE_VAL" == "1" ]]; then
            PRERELEASE_FLAG='--prerelease'
          else
            PRERELEASE_FLAG=''
          fi

          if [[ "$LATEST_VAL" == "0" ]]; then
            LATEST_FLAG='--latest=false'
          else
            LATEST_FLAG='--latest'
          fi

          if [[ "$DRAFT_VAL" == "1" ]]; then
            DRAFT_FLAG='--draft'
          else
            DRAFT_FLAG=''
          fi

          gh release create "${TAG_NAME}" "${FILES[@]}" \
            --repo "${REPO}" \
            --title "${ANNOUNCEMENT_TITLE}" \
            --notes "$NOTES" \
            ${DRAFT_FLAG} \
            ${PRERELEASE_FLAG} \
            ${LATEST_FLAG}
